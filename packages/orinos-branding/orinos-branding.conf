# Type Path             Mode User Group Age Argument
# L+ forces replacement of Arch's os-release symlink and /etc/issue with
# symlinks pointing at the OrinOs files shipped under /usr/share/orinos-branding.
L+     /etc/os-release  -    -    -     -   ../usr/share/orinos-branding/os-release
L+     /etc/issue       -    -    -     -   ../usr/share/orinos-branding/issue
